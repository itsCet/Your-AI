<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Edit Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Caveat:wght@700&family=DM+Serif+Display&family=Instrument+Serif:ital@1&family=Inter:ital,wght@0,400;0,600;0,800;1,800&family=Playfair+Display:ital,wght@1,700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111111; --panel: #1b1b1b; --card: #222222; --line: #333333;
    --text: #f2f2f2; --muted: #9a9a9a; --yellow: #ffd60a; --red: #ff5a4f; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 800; letter-spacing: .02em; }
  .dots { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .dot { height: 26px; border-radius: 13px; border: 1px solid var(--line); background: none; font-size: 12px; color: var(--muted); padding: 0 10px; }
  .dot.on { background: var(--text); color: #000; border-color: var(--text); }
  .dot.done { border-color: var(--yellow); color: var(--yellow); }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 24px; padding: 20px; max-width: 1500px; margin: 0 auto; }
  .stage { position: sticky; top: 72px; align-self: start; }
  .stage canvas#main { width: 100%; aspect-ratio: 9/16; border-radius: var(--radius); background: #000; display: block; }
  #timeline { width: 100%; height: 56px; display: block; margin-top: 10px; border-radius: 8px; background: var(--panel); cursor: pointer; }
  .transport { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .transport button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .transport .play { color: var(--yellow); font-weight: 600; }
  .transport .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .filename { color: var(--muted); font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .step-head p { margin: 0; }
  .step-head b { font-weight: 600; }
  .nav { margin-left: auto; display: flex; gap: 8px; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; }
  .btn.primary { background: var(--text); color: #000; border-color: var(--text); font-weight: 600; }
  .btn.yellow { background: var(--yellow); color: #000; border-color: var(--yellow); font-weight: 600; }
  .btn:disabled { opacity: .4; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background: var(--panel); border: 2px solid transparent; border-radius: var(--radius); padding: 10px; position: relative; transition: border-color .15s; }
  .card canvas { width: 100%; aspect-ratio: 9/16; border-radius: 10px; display: block; background: #000; }
  .card .num { position: absolute; top: 16px; left: 18px; font-size: 12px; color: #fff; text-shadow: 0 1px 3px #000; z-index: 1; }
  .card h3 { margin: 10px 2px 2px; font-size: 14px; }
  .card p { margin: 0 2px 10px; color: var(--muted); font-size: 12px; }
  .card .row { display: flex; gap: 6px; }
  .card .row button { flex: 1; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; font-size: 12px; }
  .card .row button.go { background: var(--text); color: #000; border-color: var(--text); font-weight: 600; }
  .card.sel { border-color: var(--text); }
  .card.taken { border-color: var(--yellow); }
  .card.taken .take { color: var(--yellow); border-color: var(--yellow); }
  .card.clickable { cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 2px 10px; }
  .chips span { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .hookline { margin: 2px 2px 0; font-size: 12px; color: var(--text); font-style: italic; }
  .drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 60px 20px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--yellow); color: var(--text); }
  .drop strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .options { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 16px 0; color: var(--muted); }
  .options label { display: flex; gap: 6px; align-items: center; }
  select, .field input, input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .field { display: block; margin-bottom: 14px; max-width: 520px; }
  .field span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .field input { width: 100%; }
  .panel { background: var(--panel); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; }
  .banner { background: #2a2610; border: 1px solid #5c5214; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 400; font-size: 12px; }
  td input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
  td input[type=number] { width: 80px; }
  td button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12px; white-space: nowrap; }
  .scroll { max-height: 420px; overflow: auto; }
  .progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 12px 0; }
  .progress div { height: 100%; width: 0; background: var(--yellow); transition: width .2s; }
  .muted { color: var(--muted); }
  .err { color: var(--red); }
  .swatches { display: flex; gap: 4px; margin: 8px 2px 0; }
  .swatches i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #444; }
  input[type=range] { accent-color: var(--yellow); }
  textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; resize: vertical; }
  .card textarea.note { margin-top: 8px; font-size: 12px; }
  .card .more { width: 100%; margin-top: 6px; background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px; }
  .card .more:hover { color: var(--text); }
  .verdicts button.on.v-keep { background: #1d3a26; border-color: #3ddc97; color: #3ddc97; }
  .verdicts button.on.v-maybe { background: #3a3210; border-color: var(--yellow); color: var(--yellow); }
  .verdicts button.on.v-drop { background: #3a1614; border-color: var(--red); color: var(--red); }
  .card.dropped { opacity: .45; }
  .card.maybe { border-color: #6b5a12; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  .tab.on { background: var(--text); color: #000; border-color: var(--text); }
  .tab.on .muted { color: #555; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .media-list { display: grid; gap: 12px; margin-top: 16px; }
  .media-row { display: flex; gap: 14px; align-items: flex-start; margin: 0; }
  .media-row .thumb { width: 96px; height: 128px; object-fit: cover; border-radius: 10px; background: #000; flex: none; }
  .media-row .thumb.checker { object-fit: contain; background: repeating-conic-gradient(#2a2a2a 0 25%, #1f1f1f 0 50%) 0 0 / 16px 16px; }
  .media-body { flex: 1; min-width: 0; }
  .media-name { font-weight: 600; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; overflow-wrap: anywhere; }
  .chip { font-size: 11px; color: var(--yellow); border: 1px solid #5c5214; border-radius: 999px; padding: 1px 8px; font-weight: 400; }
  .understood { color: #9be3b8; font-size: 12px; margin: 6px 0; }
  .options.compact { margin: 6px 0 0; gap: 10px; font-size: 12px; }
  .options.compact input[type=number] { width: 70px; }
  .options.compact input[type=text] { width: 160px; }
  .options input[type=number], .options input[type=text] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  @media (max-width: 860px) { .media-row { flex-direction: column; } .media-row .thumb { width: 100%; height: 180px; } }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    .stage { position: static; max-width: 300px; margin: 0 auto; }
    header { flex-wrap: wrap; }
    .step-head { flex-wrap: wrap; }
    .grid, .grid.wide { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>Video Edit Studio</h1>
  <div class="dots" id="dots"></div>
</header>
<main>
  <section class="stage">
    <canvas id="main" width="540" height="960"></canvas>
    <canvas id="timeline" width="680" height="112" title="Clique pour te déplacer dans la vidéo"></canvas>
    <div class="transport">
      <button id="back5">−5s</button>
      <button id="play" class="play">Pause</button>
      <button id="fwd5">+5s</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="filename" id="filename">Aucune vidéo</div>
  </section>
  <section>
    <div class="step-head">
      <p id="stepText"></p>
      <div class="nav">
        <button class="btn" id="prev">Retour</button>
        <button class="btn primary" id="next">Suivant</button>
      </div>
    </div>
    <div id="content"></div>
  </section>
</main>
<video id="video" playsinline muted loop style="display:none"></video>
<script type="module" src="js/app.js"></script>
</body>
</html>
