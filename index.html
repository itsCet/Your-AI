<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Edit Studio</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Caveat:wght@600;700&family=DM+Serif+Display&family=Fraunces:ital,wght@0,800;1,700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Montserrat:wght@700;800&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@600;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<style>
  @font-face { font-family: 'Geist'; src: url('fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  :root {
    --bg: #111111; --panel: #1b1b1b; --card: #222222; --line: #333333;
    --text: #f2f2f2; --muted: #9a9a9a; --yellow: #ffd60a; --red: #ff5a4f; --green: #3ddc97; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 800; letter-spacing: .02em; }
  .tabs-top { display: flex; gap: 4px; margin-left: auto; }
  .tabs-top button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); font-weight: 600; }
  .tabs-top button.on { color: var(--text); border-bottom-color: var(--text); }
  .tabs-top button:disabled { opacity: .35; cursor: default; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 24px; padding: 20px; max-width: 1500px; margin: 0 auto; }
  .stage { position: sticky; top: 64px; align-self: start; }
  .stage canvas#main { width: 100%; aspect-ratio: 9/16; border-radius: var(--radius); background: #000; display: block; }
  #timeline { width: 100%; height: 56px; display: block; margin-top: 10px; border-radius: 8px; background: var(--panel); cursor: pointer; }
  .transport { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .transport button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .transport .play { color: var(--yellow); font-weight: 600; }
  .transport .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .filename { color: var(--muted); font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .steps { display: flex; gap: 2px; margin-bottom: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .steps button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); }
  .steps button.on { color: var(--text); border-bottom-color: var(--text); }
  .steps button .ok { color: var(--green); margin-left: 4px; }
  .lead { color: var(--muted); margin: 6px 0 14px; }
  .lead b { color: var(--text); font-weight: 600; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .btn.primary { background: var(--text); color: #000; border-color: var(--text); font-weight: 600; }
  .btn.yellow { background: var(--yellow); color: #000; border-color: var(--yellow); font-weight: 600; }
  .btn.small { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chips-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .chip-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12px; }
  .chip-btn.on { border-color: var(--text); background: #2a2a2a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 2px solid transparent; border-radius: var(--radius); padding: 10px; position: relative; transition: border-color .15s; cursor: pointer; }
  .card canvas { width: 100%; aspect-ratio: 9/16; border-radius: 10px; display: block; background: #000; }
  .card .num { position: absolute; top: 16px; left: 16px; z-index: 1; font-size: 11px; color: #fff; background: rgba(0,0,0,.6); border-radius: 999px; padding: 2px 8px; }
  .card h3 { margin: 10px 2px 2px; font-size: 14px; }
  .card p { margin: 0 2px 8px; color: var(--muted); font-size: 12px; }
  .card .take { width: 100%; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-size: 12px; }
  .card.sel { border-color: var(--text); }
  .card.sel .take { background: var(--text); color: #000; border-color: var(--text); font-weight: 600; }
  .card.off { opacity: .55; }
  .swatches { display: flex; gap: 4px; margin: 6px 2px 8px; }
  .swatches i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #444; }
  .panel { background: var(--panel); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; }
  .options { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 8px 0; color: var(--muted); }
  .options label { display: flex; gap: 6px; align-items: center; }
  select, input[type=text], input[type=number], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; color: var(--text); }
  input[type=number] { width: 76px; }
  textarea { width: 100%; resize: vertical; }
  input[type=range] { accent-color: var(--yellow); }
  .drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 50px 20px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--yellow); color: var(--text); }
  .drop strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 10px 0; }
  .progress div { height: 100%; width: 0; background: var(--yellow); transition: width .2s; }
  .muted { color: var(--muted); }
  .err { color: var(--red); }
  .ok { color: var(--green); }
  /* Éditeur de transcription */
  .doc { background: var(--panel); border-radius: var(--radius); padding: 18px 20px; font-size: 17px; line-height: 2.1; user-select: text; }
  .doc p { margin: 0 0 10px; }
  .doc .ts { color: var(--muted); font-size: 11px; margin-right: 6px; user-select: none; font-variant-numeric: tabular-nums; cursor: pointer; }
  .wd { border-radius: 4px; padding: 1px 1px; cursor: text; }
  .wd:hover { background: #2c2c2c; }
  .wd.now { background: #3a3410; }
  .wd.sel { background: #3d5afe55; }
  .wd.cut { text-decoration: line-through; color: #6b6b6b; }
  .wd.fixed { border-bottom: 2px dotted var(--green); }
  .wd.inrange { box-shadow: inset 0 -3px 0 var(--chip, #ffd60a); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1; font-weight: 700; padding: 4px 7px; border-radius: 6px; margin: 0 4px; vertical-align: 2px; cursor: pointer; user-select: none; color: #000; }
  .chip.on { outline: 2px solid #fff; }
  .chip.trans { background: #2b2b2b; color: #ddd; border: 1px dashed #6a6a6a; }
  .pause { color: #555; font-size: 12px; user-select: none; cursor: pointer; }
  .pause.cut { text-decoration: line-through; }
  .inspector { position: sticky; top: 64px; z-index: 3; background: #202020; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .inspector h2 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  .inspector .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 8px 0; }
  .inspector .fields label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .inspector .fields label.wide { grid-column: 1 / -1; }
  .media-row { display: flex; gap: 12px; align-items: flex-start; }
  .media-row .thumb { width: 72px; height: 96px; object-fit: cover; border-radius: 8px; background: #000; flex: none; }
  .understood { color: #9be3b8; font-size: 12px; margin: 4px 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal > div { background: #1b1b1b; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; width: min(720px, 100%); max-height: 90vh; overflow: auto; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    .stage { position: static; max-width: 300px; margin: 0 auto; }
    header { flex-wrap: wrap; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .inspector { position: static; }
  }
</style>
</head>
<body>
<header>
  <h1>Video Edit Studio</h1>
  <nav class="tabs-top" id="tabs"></nav>
</header>
<main>
  <section class="stage">
    <canvas id="main" width="540" height="960"></canvas>
    <canvas id="timeline" width="680" height="112" title="Clique pour te déplacer dans la vidéo"></canvas>
    <div class="transport">
      <button id="back5">−5s</button>
      <button id="play" class="play">Lecture</button>
      <button id="fwd5">+5s</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="filename" id="filename">Aucune vidéo</div>
  </section>
  <section id="content"></section>
</main>
<video id="video" playsinline muted style="display:none"></video>
<script type="module" src="js/app.js"></script>
</body>
</html>
